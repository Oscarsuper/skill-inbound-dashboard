<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guiones · Seguros Vida Grupo Deudor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --azul:#2B0B6B;--azul2:#4A1D96;--azul3:#7C3AED;--lila:#A78BFA;--lila-lt:#EDE9FE;
  --bg:#F8F5FF;--w:#fff;--ln:#DDD6FE;--txt:#6B7280;--dk:#1E1235;
  --ok:#16A34A;--ok-bg:#DCFCE7;--wn:#D97706;--wn-bg:#FEF3C7;--bad:#DC2626;--bad-bg:#FEE2E2;
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--dk);
  line-height:1.6}
button{font-family:inherit;cursor:pointer}

/* ── BARRA ── */
nav{background:linear-gradient(100deg,var(--azul),var(--azul2));padding:0 22px;min-height:62px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:60}
.nlogo{font-size:14.5px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px}
.nlogo small{display:block;font-size:9.5px;color:rgba(255,255,255,.45);font-weight:600;letter-spacing:.3px}
.nbusca{margin-left:auto;display:flex;align-items:center;gap:8px}
.nbusca input{padding:8px 14px;border-radius:9px;border:1.5px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.1);color:#fff;font-size:12.5px;width:270px;outline:none;font-family:inherit}
.nbusca input::placeholder{color:rgba(255,255,255,.45)}
.nbusca input:focus{border-color:var(--lila);background:rgba(255,255,255,.16)}
.nimp{padding:8px 15px;border-radius:9px;font-size:11.5px;font-weight:700;border:1px solid rgba(255,255,255,.3);
  background:transparent;color:#fff}
.nimp:hover{background:rgba(255,255,255,.15)}

/* ── DISPOSICIÓN ── */
.wrap{display:flex;gap:22px;max-width:1420px;margin:0 auto;padding:22px}
aside{width:272px;flex-shrink:0;position:sticky;top:84px;align-self:flex-start;max-height:calc(100vh-106px);
  overflow-y:auto}
.a-tit{font-size:10px;font-weight:800;color:var(--azul3);text-transform:uppercase;letter-spacing:1.4px;
  margin:0 0 10px 4px}
.a-item{display:block;width:100%;text-align:left;border:1px solid var(--ln);background:var(--w);
  border-radius:11px;padding:11px 14px;margin-bottom:8px;transition:all .14s;color:var(--dk)}
.a-item:hover{border-color:var(--azul3);transform:translateX(3px)}
.a-item.act{background:var(--azul2);border-color:var(--azul2);color:#fff}
.a-item b{display:block;font-size:12.5px;font-weight:700;line-height:1.35}
.a-item span{display:block;font-size:10.5px;color:var(--txt);margin-top:3px}
.a-item.act span{color:rgba(255,255,255,.65)}
main{flex:1;min-width:0}

/* ── GUION ── */
.g{display:none}.g.act{display:block}
.g-cab{background:linear-gradient(100deg,var(--azul2),var(--azul3));color:#fff;border-radius:15px;
  padding:22px 26px;margin-bottom:20px}
.g-cab .et{font-size:10px;font-weight:800;letter-spacing:1.6px;opacity:.72;text-transform:uppercase}
.g-cab h1{font-size:23px;margin:6px 0 8px;line-height:1.25}
.g-cab p{font-size:13px;color:#DDD6FE;max-width:70ch}

.bloque{background:var(--w);border:1px solid var(--ln);border-radius:14px;margin-bottom:16px;overflow:hidden}
.b-tit{background:#FAF8FF;border-bottom:1px solid var(--ln);padding:11px 20px;font-size:10.5px;
  font-weight:800;color:var(--azul2);text-transform:uppercase;letter-spacing:1.2px;
  display:flex;align-items:center;gap:9px}
.b-tit .n{width:21px;height:21px;border-radius:50%;background:var(--azul3);color:#fff;font-size:10px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.b-body{padding:17px 20px}
.b-body p{font-size:13.5px;margin-bottom:10px}
.b-body p:last-child{margin-bottom:0}

/* Lo que el agente dice en voz alta */
.decir{background:var(--lila-lt);border-left:4px solid var(--azul3);border-radius:0 10px 10px 0;
  padding:14px 18px;margin:4px 0 12px;font-size:14px;line-height:1.72}
.decir:before{content:'🗣 Dices';display:block;font-size:9.5px;font-weight:800;color:var(--azul2);
  letter-spacing:1.3px;margin-bottom:7px;text-transform:uppercase}
.decir em{color:var(--azul2);font-style:normal;font-weight:700;background:rgba(124,58,237,.1);
  padding:1px 5px;border-radius:4px}

ul.lista{list-style:none;margin:2px 0 4px}
ul.lista li{font-size:13.5px;padding:7px 0 7px 27px;position:relative;border-bottom:1px solid #F4F1FD}
ul.lista li:last-child{border-bottom:none}
ul.lista li:before{content:'';position:absolute;left:8px;top:15px;width:6px;height:6px;border-radius:50%;
  background:var(--lila)}
ul.lista.chk li:before{content:'✔';background:none;left:4px;top:7px;width:auto;height:auto;
  color:var(--ok);font-weight:800;font-size:12px}
ul.lista.no li:before{content:'✕';background:none;left:4px;top:7px;width:auto;height:auto;
  color:var(--bad);font-weight:800;font-size:12px}

/* Objeción y respuesta */
.obj{border:1px solid var(--ln);border-radius:11px;padding:13px 16px;margin-bottom:10px;background:#FCFBFF}
.obj .q{font-size:13px;font-weight:700;color:var(--bad);margin-bottom:7px}
.obj .q:before{content:'Cliente: ';color:var(--txt);font-weight:600}
.obj .r{font-size:13.5px;line-height:1.65}
.obj .r:before{content:'Respondes: ';color:var(--azul2);font-weight:700;font-size:12px}

.nota{border-radius:11px;padding:13px 17px;font-size:13px;line-height:1.65;margin-bottom:14px}
.nota.alerta{background:var(--bad-bg);border:1px solid #FECACA;color:#991B1B}
.nota.ojo{background:var(--wn-bg);border:1px solid #FDE68A;color:#92400E}
.nota.dato{background:var(--ok-bg);border:1px solid #BBF7D0;color:#14532D}
.nota b{font-weight:800}

table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--azul2);color:#fff;padding:9px 13px;text-align:left;font-size:10px;font-weight:800;
  text-transform:uppercase;letter-spacing:.7px}
td{padding:9px 13px;border-bottom:1px solid #F1EDFD;vertical-align:top}
tr:last-child td{border-bottom:none}
td.k{font-weight:700;width:34%;color:var(--azul2)}

.tag{display:inline-block;background:var(--lila-lt);color:var(--azul2);border-radius:20px;
  padding:3px 11px;font-size:10.5px;font-weight:800;margin:2px 4px 2px 0}
.tag.v{background:var(--ok-bg);color:var(--ok)}
.tag.r{background:var(--bad-bg);color:var(--bad)}
code{background:#F1EDFD;color:var(--azul2);padding:2px 7px;border-radius:5px;font-size:12px;
  font-family:'Courier New',Courier,monospace;font-weight:700}
.vacio{text-align:center;padding:50px 20px;color:var(--txt);font-size:14px}

@media print{
  nav,aside{display:none}
  .wrap{display:block;padding:0;max-width:none}
  .g{display:block !important;page-break-after:always}
  .bloque{break-inside:avoid}
  body{background:#fff}
}
@media(max-width:980px){
  .wrap{flex-direction:column}
  aside{width:100%;position:static;max-height:none}
  .nbusca input{width:170px}
}
</style>
</head>
<body>

<nav>
  <div class="nlogo">🌾 <div>Guiones de atención<small>Seguros · Vida Grupo Deudor · Banco Agrario</small></div></div>
  <div class="nbusca">
    <input type="text" id="q" placeholder="Buscar: documentos, ITP, demora, endoso..." oninput="buscar()">
    <button class="nimp" onclick="window.print()">🖨 Imprimir</button>
  </div>
</nav>

<div class="wrap">
  <aside>
    <div class="a-tit">Guiones</div>
    <div id="menu"></div>
  </aside>
  <main id="main"></main>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   Contenido tomado de «Proceso de Radicación de Siniestros · Vida Grupo
   Deudor», Jefatura de Seguros, 14 de mayo de 2026.
   Para agregar o corregir un guion, edita este bloque y nada más.
   ══════════════════════════════════════════════════════════════════════ */
const GUIONES = [
{
  id:'vida',
  menu:'Reclamación por fallecimiento',
  sub:'Amparo VIDA · muerte por cualquier causa',
  etiqueta:'Siniestro · Amparo Vida',
  titulo:'Reclamación por fallecimiento del deudor',
  intro:'Llama un familiar o apoderado de un cliente fallecido que tenía crédito con el Banco. '
       +'Quiere saber qué hacer con el seguro. Es la llamada más delicada del proceso: del otro lado '
       +'hay un duelo reciente.',
  bloques:[
    {t:'Apertura', decir:
      'Buenos días, le habla <em>[tu nombre]</em> del Banco Agrario. Antes de continuar quiero '
      +'expresarle mis condolencias. Con gusto le explico el proceso del seguro, vamos paso a paso.'},
    {t:'Qué confirmas antes de explicar', lista:[
      'Que la persona fallecida tenía una obligación vigente con el Banco.',
      'El parentesco de quien llama con el deudor.',
      'Si ya pasó por una oficina del Banco o es el primer contacto.',
      'Si tiene a la mano el registro civil de defunción.']},
    {t:'Lo que le explicas', decir:
      'El crédito de <em>[nombre del deudor]</em> cuenta con un seguro de Vida Grupo Deudor. '
      +'Ese seguro cubre el saldo de la obligación en caso de fallecimiento, así que la familia '
      +'no tiene que asumir la deuda. Para activarlo hay que radicar la reclamación en cualquier '
      +'oficina del Banco con unos documentos. Se los indico y los anota con calma.'},
    {t:'Documentos que debe llevar', tabla:[
      ['Copia de la cédula','Del deudor fallecido.'],
      ['Registro civil de defunción','Expedido por la Registraduría. Es el documento que no puede faltar.'],
      ['Documento que demuestre parentesco','Registro civil de nacimiento, matrimonio o el que aplique.']],
     nota:{tipo:'dato', txt:'<b>Esto lo aporta la oficina, no el cliente:</b> el formato de reclamación '
       +'<code>AB-AD-FT-027</code>, el pagaré de las obligaciones vigentes y el seguro de esas obligaciones. '
       +'Si el cliente pregunta por esos tres, dile que la oficina los adjunta.'}},
    {t:'Cómo cierras la explicación', decir:
      'Con esos tres documentos se acerca a cualquier oficina del Banco Agrario. Allá le llenan el '
      +'formato de reclamación y radican el caso en el aplicativo. Desde que queda radicado, la '
      +'respuesta de la aseguradora toma entre <em>40 y 45 días hábiles</em>.'},
    {t:'Objeciones frecuentes', objeciones:[
      ['No tengo todavía el registro civil de defunción.',
       'Puede acercarse igual a la oficina para que le expliquen el formato, pero la reclamación '
       +'solo avanza con ese documento. Mientras lo tramita en la Registraduría va adelantando el resto.'],
      ['¿Y mientras tanto nos siguen cobrando el crédito?',
       'La obligación sigue registrada hasta que la aseguradora responda. Por eso es importante radicar '
       +'lo antes posible. En la oficina le explican cómo queda su caso mientras se resuelve.'],
      ['¿Puedo radicarlo por correo o por aquí mismo?',
       'La radicación se hace en oficina, porque allí revisan que los documentos estén completos y '
       +'anexan el pagaré y la póliza. Eso evita que la reclamación se devuelva.'],
      ['¿Cuánto me van a pagar a mí?',
       'El seguro no entrega dinero a la familia: paga el saldo de la deuda directamente al Banco, '
       +'que es el primer beneficiario. Lo que se logra es que la obligación quede saldada.']]},
    {t:'Tipificación', tipif:[
      ['Cuándo','Si el cliente solo pidió información del proceso.'],
      ['Qué registras','La orientación entregada y si se le indicó acercarse a oficina.'],
      ['Si reclama por demora','Ahí sí va la tipología de PQRS en BACResuelve: '
        +'<code>Demora en reclamaciones por seguros de obligaciones crediticias</code>.']]},
    {t:'Alertas', alerta:
      'Nunca prometas que la reclamación será aprobada ni des una fecha exacta de pago: quien decide '
      +'es la aseguradora. Tampoco cites un valor de saldo que no tengas confirmado en el sistema.'}
  ]
},
{
  id:'itp',
  menu:'Reclamación por incapacidad',
  sub:'Amparo ITP · incapacidad total y permanente',
  etiqueta:'Siniestro · Amparo ITP',
  titulo:'Reclamación por Incapacidad Total y Permanente',
  intro:'Llama el propio deudor o un familiar porque el cliente quedó en incapacidad total y permanente. '
       +'El amparo existe igual que el de vida, pero los documentos son distintos: aquí lo que sustenta '
       +'la reclamación es la historia clínica.',
  bloques:[
    {t:'Apertura', decir:
      'Buenos días, le habla <em>[tu nombre]</em> del Banco Agrario. Entiendo que me consulta por el '
      +'seguro del crédito por una condición de salud. Con gusto le explico qué se necesita.'},
    {t:'Qué confirmas antes de explicar', lista:[
      'Que la obligación con el Banco está vigente.',
      'Si la incapacidad ya fue calificada o está en trámite.',
      'Qué documentación médica tiene disponible.',
      'El parentesco, si quien llama no es el deudor.']},
    {t:'Lo que le explicas', decir:
      'El crédito cuenta con el amparo de <em>Incapacidad Total y Permanente</em> dentro del seguro de '
      +'Vida Grupo Deudor. Para estudiarlo, la aseguradora necesita la documentación médica que respalde '
      +'la condición. Le indico qué debe reunir.'},
    {t:'Documentos que debe llevar', tabla:[
      ['Copia de la cédula','Del deudor.'],
      ['Documentación médica','Historia clínica, exámenes de diagnóstico, conceptos médicos y <b>toda</b> '
        +'la documentación médica que el reclamante pueda aportar.'],
      ['Documento que demuestre parentesco','Solo si quien radica no es el titular.']],
     nota:{tipo:'dato', txt:'<b>Lo aporta la oficina:</b> formato de reclamación <code>AB-AD-FT-027</code>, '
       +'pagaré de las obligaciones vigentes y seguro de esas obligaciones.'}},
    {t:'La frase que evita un reproceso', decir:
      'Le recomiendo llevar toda la documentación médica que tenga, aunque le parezca repetida. '
      +'Entre más soporte, menos probable que la aseguradora pida documentos adicionales y se '
      +'alargue el trámite.'},
    {t:'Objeciones frecuentes', objeciones:[
      ['Todavía no me han calificado la invalidez.',
       'Puede radicar con lo que tenga y la aseguradora le indica si requiere la calificación. '
       +'En la oficina le reciben la documentación y la registran.'],
      ['Son muchos papeles, ¿no basta con una incapacidad médica?',
       'Una incapacidad temporal no alcanza, porque el amparo cubre la incapacidad total y permanente. '
       +'Por eso piden la historia clínica y los conceptos médicos.'],
      ['¿Esto lo puedo enviar por correo?',
       'La radicación es en oficina. Allá revisan que esté completo y adjuntan los documentos del crédito '
       +'que ellos manejan.']]},
    {t:'Tipificación', tipif:[
      ['Cuándo','Orientación sobre el amparo de ITP y sus requisitos.'],
      ['Qué registras','Los documentos que se le indicaron y si se remitió a oficina.'],
      ['Si reclama por demora','<code>Demora en reclamaciones por seguros de obligaciones crediticias</code> en BACResuelve.']]},
    {t:'Alertas', alerta:
      'No opines sobre si la condición médica del cliente califica o no como incapacidad total y '
      +'permanente. Esa valoración es de la aseguradora, no del Banco ni tuya.'}
  ]
},
{
  id:'demora',
  menu:'Demora o estado del trámite',
  sub:'Reclamación ya radicada',
  etiqueta:'Seguimiento · PQRS',
  titulo:'El cliente pregunta por una reclamación ya radicada',
  intro:'Es la llamada más común después de la radicación. El cliente ya entregó los documentos y quiere '
       +'saber en qué va. Aquí lo que más molesta no es el tiempo, es no saber.',
  bloques:[
    {t:'Apertura', decir:
      'Con gusto le reviso el estado de su reclamación. ¿Me confirma el número de documento del deudor '
      +'y aproximadamente en qué fecha la radicó en la oficina?'},
    {t:'Qué confirmas', lista:[
      'Fecha de radicación en la oficina.',
      'Si le entregaron copia del formato de reclamación.',
      'Si ya recibió algún correo de la aseguradora o del corredor.',
      'Si la oficina le informó que faltaban documentos.']},
    {t:'La explicación del tiempo', decir:
      'El trámite tiene cuatro etapas: radicación de los documentos, verificación, envío a la aseguradora '
      +'y respuesta de la aseguradora. En total toma entre <em>40 y 45 días hábiles</em> aproximadamente. '
      +'Son días hábiles, así que no cuentan fines de semana ni festivos.'},
    {t:'Según cuánto lleve', tabla:[
      ['Menos de 40 días hábiles','Está dentro del tiempo. Explicas las etapas y confirmas la fecha estimada.'],
      ['Entre 40 y 45 días hábiles','Está en el límite. Informas que ya debe estar en la última etapa.'],
      ['Más de 45 días hábiles','Se radica PQRS con la tipología de demora.']],
     nota:{tipo:'ojo', txt:'Si el cliente dice que la oficina le pidió documentos que no entregó, '
       +'el reloj no corre: el trámite está detenido hasta que los aporte. Verifícalo antes de ofrecer una fecha.'}},
    {t:'Cuando ya se pasó del tiempo', decir:
      'Entiendo su molestia y tiene razón en reclamar. Voy a dejar registrada su inconformidad para que '
      +'el área de seguros le haga seguimiento. Le confirmo que su caso queda radicado con el número '
      +'<em>[número]</em> y por ese medio le responderán.'},
    {t:'Tipificación', tipif:[
      ['Aplicativo','BACResuelve, el aplicativo de radicación de PQRS.'],
      ['Tipología','<code>Demora en reclamaciones por seguros de obligaciones crediticias</code>'],
      ['Cuándo usarla','Inconformidades, demoras y solicitudes formales de documentos.']]},
    {t:'Objeciones frecuentes', objeciones:[
      ['Ya van dos meses y nadie me dice nada.',
       'Entiendo. Déjeme revisar desde cuándo está radicado. Si ya superó los 45 días hábiles le radico '
       +'la inconformidad en este momento para que el área de seguros le dé respuesta.'],
      ['¿Usted no me puede decir si ya lo aprobaron?',
       'La decisión la toma la aseguradora y la comunica directamente. Lo que sí puedo hacer es dejar '
       +'registrada su solicitud para que le informen el estado.'],
      ['Quiero hablar con la aseguradora directamente.',
       'Las inquietudes del proceso se atienden al correo <em>gestion.siniestros@wtwco.com</em>. '
       +'De todas formas le dejo radicada su solicitud por este canal.']]},
    {t:'Alertas', alerta:
      'No cuentes los 40 a 45 días en días calendario. Son <b>días hábiles</b>: 45 días hábiles son '
      +'algo más de dos meses corridos. Decirle al cliente «mes y medio» genera un reclamo seguro.'}
  ]
},
{
  id:'direcciona',
  menu:'A dónde se direcciona',
  sub:'Oficinas, corredor o PQRS',
  etiqueta:'Direccionamiento',
  titulo:'A quién se direcciona cada solicitud',
  intro:'La mitad de los reprocesos nacen aquí: mandar al cliente al canal equivocado. Esta es la tabla '
       +'de decisión; revísala antes de cerrar la llamada.',
  bloques:[
    {t:'Tabla de decisión', tabla:[
      ['Aviso de reclamación por siniestro','Oficinas del Banco. Es donde se radica.'],
      ['Inclusión de nueva documentación a una reclamación','Oficinas del Banco.'],
      ['Endoso de póliza con otra aseguradora','Corredor de seguros: <code>endosos.bancoagrario@wtwco.com</code>'],
      ['Inconformidad, demora o solicitud formal de documentos','BACResuelve, tipología de demora en reclamaciones.'],
      ['Dudas del proceso (interno)','<code>gestion.siniestros@wtwco.com</code>'],
      ['Cancelación de seguro voluntario','BACResuelve: <code>Cancelación de seguros voluntarios</code>.'],
      ['Información general de pólizas voluntarias','BACResuelve: <code>Información general de pólizas seguros voluntarios</code>.']]},
    {t:'Lo que le dices al cliente', decir:
      'Su solicitud la gestiona <em>[oficina / el corredor de seguros]</em>. Le explico cómo debe hacerlo '
      +'para que no tenga que llamar de nuevo.'},
    {t:'Seguros generales deudores', nota:{tipo:'dato', txt:
      'Si la reclamación es de <b>Seguros Generales Deudores</b> —pólizas de automóviles, incendio, o '
      +'maquinaria y equipo— aplica <b>exactamente el mismo procedimiento</b> que Vida Grupo Deudor. '
      +'No es un proceso aparte.'}},
    {t:'Qué nunca haces', listaNo:[
      'Mandar al cliente a la aseguradora por su cuenta a radicar un siniestro.',
      'Decirle que envíe los documentos por correo electrónico: la radicación es en oficina.',
      'Entregarle el correo interno de gestión de siniestros como si fuera un canal de atención al cliente.',
      'Cerrar la llamada sin dejar claro cuál es el siguiente paso y quién lo hace.']},
    {t:'Alertas', ojo:
      'Las oficinas del Banco deben tramitar las reclamaciones de Vida Grupo Deudor <b>exclusivamente '
      +'por el aplicativo ABC Siniestros</b>. Si una oficina te consulta por otro canal, recuérdaselo.'}
  ]
},
{
  id:'voluntarios',
  menu:'Seguros voluntarios',
  sub:'Cancelación e información de pólizas',
  etiqueta:'Seguros voluntarios',
  titulo:'Cancelación e información de seguros voluntarios',
  intro:'Los voluntarios son distintos de los obligatorios: el cliente los tomó por decisión propia y '
       +'puede pedir cancelarlos. En BACResuelve tienen sus propias dos tipologías.',
  bloques:[
    {t:'Primero distingue qué tipo de seguro es', tabla:[
      ['Seguro obligatorio','Va atado al crédito. El de Vida Grupo Deudor es obligatorio: no se cancela '
        +'mientras exista la obligación.'],
      ['Seguro voluntario','Lo tomó el cliente aparte. Sí admite cancelación y consulta de información.']],
     nota:{tipo:'ojo', txt:'Si el cliente pide cancelar «el seguro del crédito», confirma primero cuál es. '

<script>
var esc = function(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
/* El contenido trae marcas propias —<em>, <code>, <b>— escritas a mano,
   así que se inserta tal cual y solo se escapa lo que viene de fuera. */
var ACTUAL = GUIONES[0].id;

function pintarMenu(){
  document.getElementById('menu').innerHTML = GUIONES.map(function(g){
    return '<button class="a-item'+(g.id===ACTUAL?' act':'')+'" onclick="abrir(\''+g.id+'\')">'
      +'<b>'+g.menu+'</b><span>'+g.sub+'</span></button>';
  }).join('');
}

function bloque(b, i){
  var h='<div class="bloque"><div class="b-tit"><span class="n">'+(i+1)+'</span>'+b.t+'</div><div class="b-body">';
  if(b.decir)   h+='<div class="decir">'+b.decir+'</div>';
  if(b.lista)   h+='<ul class="lista chk">'+b.lista.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';
  if(b.listaNo) h+='<ul class="lista no">'+b.listaNo.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';
  if(b.tabla)   h+='<table>'+b.tabla.map(function(f){
                     return '<tr><td class="k">'+f[0]+'</td><td>'+f[1]+'</td></tr>'; }).join('')+'</table>';
  if(b.tipif)   h+='<table><tr><th>Campo</th><th>Qué va</th></tr>'+b.tipif.map(function(f){
                     return '<tr><td class="k">'+f[0]+'</td><td>'+f[1]+'</td></tr>'; }).join('')+'</table>';
  if(b.objeciones) h+=b.objeciones.map(function(o){
                     return '<div class="obj"><div class="q">'+o[0]+'</div><div class="r">'+o[1]+'</div></div>';
                   }).join('');
  if(b.nota)    h+='<div class="nota '+b.nota.tipo+'">'+b.nota.txt+'</div>';
  if(b.alerta)  h+='<div class="nota alerta"><b>⚠ Cuidado.</b> '+b.alerta+'</div>';
  if(b.ojo)     h+='<div class="nota ojo"><b>Ojo.</b> '+b.ojo+'</div>';
  return h+'</div></div>';
}

function pintar(){
  document.getElementById('main').innerHTML = GUIONES.map(function(g){
    return '<div class="g'+(g.id===ACTUAL?' act':'')+'" id="g-'+g.id+'">'
      +'<div class="g-cab"><div class="et">'+g.etiqueta+'</div>'
      +'<h1>'+g.titulo+'</h1><p>'+g.intro+'</p></div>'
      + g.bloques.map(bloque).join('')
      +'</div>';
  }).join('');
}

function abrir(id){
  ACTUAL=id;
  document.querySelectorAll('.g').forEach(function(x){ x.classList.remove('act'); });
  var el=document.getElementById('g-'+id); if(el) el.classList.add('act');
  document.querySelectorAll('.a-item').forEach(function(x){ x.classList.remove('act'); });
  var btns=document.querySelectorAll('.a-item');
  GUIONES.forEach(function(g,i){ if(g.id===id && btns[i]) btns[i].classList.add('act'); });
  window.scrollTo({top:0, behavior:'smooth'});
}

/* La búsqueda deja a la vista los guiones donde aparece el término y
   resalta la palabra, para no obligar a leer todo de nuevo. */
function buscar(){
  var q=document.getElementById('q').value.trim().toLowerCase();
  if(!q){ pintar(); abrir(ACTUAL); return; }
  var hallados=GUIONES.filter(function(g){
    return JSON.stringify(g).toLowerCase().indexOf(q)!==-1; });
  if(!hallados.length){
    document.getElementById('main').innerHTML=
      '<div class="bloque"><div class="vacio">Sin resultados para <b>'+esc(q)+'</b>.</div></div>';
    return;
  }
  var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  document.getElementById('main').innerHTML = hallados.map(function(g){
    var h='<div class="g act"><div class="g-cab"><div class="et">'+g.etiqueta+'</div>'
      +'<h1>'+g.titulo+'</h1><p>'+g.intro+'</p></div>'
      + g.bloques.map(bloque).join('')+'</div>';
    /* Se resalta solo fuera de las etiquetas, para no romper el html */
    return h.replace(/>([^<]+)</g, function(m, txt){
      return '>'+txt.replace(re,'<mark style="background:#FDE68A;padding:0 2px;border-radius:3px">$1</mark>')+'<';
    });
  }).join('');
}

pintarMenu(); pintar();
</script>
</body>
</html>
