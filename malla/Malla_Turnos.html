<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Malla de turnos · Semana 42</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --azul:#2B0B6B;--azul2:#4A1D96;--azul3:#7C3AED;--lila:#A78BFA;--lila-lt:#EDE9FE;
  --bg:#F8F5FF;--w:#fff;--ln:#DDD6FE;--txt:#6B7280;--dk:#1E1235;
  --ok:#16A34A;--ok-bg:#DCFCE7;--wn:#D97706;--wn-bg:#FEF3C7;--bad:#DC2626;--bad-bg:#FEE2E2;
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--dk)}
button,select,input{font-family:inherit}

nav{background:linear-gradient(100deg,var(--azul),var(--azul2));padding:0 22px;min-height:60px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:70}
.nlogo{font-size:14px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px}
.nlogo small{display:block;font-size:9.5px;color:rgba(255,255,255,.45);font-weight:600}
.ntabs{display:flex;gap:3px;margin-left:12px;flex-wrap:wrap}
.ntab{padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:700;border:none;background:none;
  color:rgba(255,255,255,.5)}
.ntab:hover{color:#fff;background:rgba(167,139,250,.14)}
.ntab.act{color:#fff;background:rgba(167,139,250,.22)}
.nder{margin-left:auto;display:flex;align-items:center;gap:9px}
.nder input,.nder select{padding:7px 12px;border-radius:8px;font-size:12px;outline:none;
  border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:#fff}
.nder input::placeholder{color:rgba(255,255,255,.45)}
.nder select option{background:var(--azul2);color:#fff}
.nder input:focus,.nder select:focus{border-color:var(--lila)}

main{padding:20px 22px 40px;max-width:1700px;margin:0 auto}
.sec{display:none}.sec.act{display:block}

/* Días */
.dias{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.dia{border:1.5px solid var(--ln);background:var(--w);border-radius:11px;padding:9px 15px;
  text-align:center;min-width:92px;transition:all .14s}
.dia:hover{border-color:var(--azul3)}
.dia.act{background:var(--azul2);border-color:var(--azul2);color:#fff}
.dia b{display:block;font-size:12.5px;font-weight:800;text-transform:capitalize}
.dia span{display:block;font-size:10px;color:var(--txt);margin-top:2px}
.dia.act span{color:rgba(255,255,255,.7)}
.dia i{display:block;font-size:10.5px;font-style:normal;font-weight:700;color:var(--azul3);margin-top:3px}
.dia.act i{color:var(--lila)}

/* Tarjetas */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--w);border:1px solid var(--ln);border-radius:13px;padding:14px 16px;
  border-left:4px solid var(--lila)}
.kpi .n{font-size:9.5px;font-weight:800;color:var(--txt);text-transform:uppercase;letter-spacing:.7px}
.kpi .v{font-size:27px;font-weight:800;margin-top:5px;letter-spacing:-.5px}
.kpi .d{font-size:10.5px;color:var(--txt);margin-top:2px;font-weight:600}
.kpi.ok{border-left-color:var(--ok)}.kpi.ok .v{color:var(--ok)}
.kpi.wn{border-left-color:var(--wn)}.kpi.wn .v{color:var(--wn)}
.kpi.bad{border-left-color:var(--bad)}.kpi.bad .v{color:var(--bad)}

.card{background:var(--w);border:1px solid var(--ln);border-radius:14px;margin-bottom:18px;overflow:hidden}
.ch{background:linear-gradient(100deg,var(--azul2),var(--azul3));color:#fff;padding:11px 18px;
  font-size:12px;font-weight:800;letter-spacing:.4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ch small{font-weight:600;opacity:.75;font-size:10.5px}
.ch .der{margin-left:auto;display:flex;gap:7px;align-items:center}
.sw{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;
  border-radius:7px;padding:4px 11px;font-size:10.5px;font-weight:700}
.sw.act{background:#fff;color:var(--azul2)}
.cbody{padding:0;overflow-x:auto}

/* Mapa de cobertura */
table.mapa{border-collapse:collapse;font-size:11px;width:100%}
table.mapa th{background:#FAF8FF;color:var(--azul2);padding:7px 4px;font-size:9.5px;font-weight:800;
  position:sticky;top:0;z-index:2;border-bottom:1px solid var(--ln);white-space:nowrap}
table.mapa th.sk{text-align:left;padding-left:16px;min-width:178px;position:sticky;left:0;z-index:3;
  background:#FAF8FF}
table.mapa td.sk{text-align:left;padding:0 16px;font-weight:700;font-size:11.5px;white-space:nowrap;
  position:sticky;left:0;background:var(--w);z-index:1;border-right:1px solid var(--ln)}
table.mapa td{text-align:center;padding:0;height:34px;border-bottom:1px solid #F4F1FD;
  font-weight:700;cursor:pointer;transition:transform .1s}
table.mapa td.c:hover{transform:scale(1.14);box-shadow:0 0 0 2px var(--azul3);position:relative;z-index:4}
table.mapa tr.tot td{background:var(--azul)!important;color:#fff;font-weight:800;height:32px;
  border-bottom:none}
table.mapa tr.tot td.sk{background:var(--azul)!important;color:#fff}
.lg{display:flex;align-items:center;gap:8px;padding:10px 18px;font-size:10.5px;color:var(--txt);
  border-top:1px solid var(--ln);flex-wrap:wrap}
.lg i{width:22px;height:13px;border-radius:3px;display:inline-block;font-style:normal}

/* Tabla de agentes */
table.ag{width:100%;border-collapse:collapse;font-size:12px}
table.ag th{background:var(--azul2);color:#fff;padding:9px 12px;text-align:left;font-size:9.5px;
  font-weight:800;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;z-index:2}
table.ag td{padding:8px 12px;border-bottom:1px solid #F4F1FD;vertical-align:middle}
table.ag tr:hover td{background:#FAF8FF}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:9.5px;font-weight:800;
  white-space:nowrap}
.sk-tag{display:inline-block;border-radius:6px;padding:2px 9px;font-size:9.5px;font-weight:800;
  color:#fff;white-space:nowrap}

/* Barra de turno */
.barra{position:relative;height:19px;background:#F4F1FD;border-radius:4px;min-width:340px}
.barra .t{position:absolute;top:0;height:100%;background:var(--azul3);border-radius:4px;opacity:.9}
.barra .p{position:absolute;top:0;height:100%;background:repeating-linear-gradient(45deg,
  rgba(255,255,255,.95),rgba(255,255,255,.95) 3px,rgba(217,119,6,.55) 3px,rgba(217,119,6,.55) 6px);
  border-left:1px solid #D97706;border-right:1px solid #D97706}
.barra .hr{position:absolute;top:0;width:1px;height:100%;background:rgba(124,58,237,.14)}
.barra b{position:absolute;color:#fff;font-size:9px;font-weight:800;line-height:19px;left:5px;
  text-shadow:0 1px 2px rgba(0,0,0,.3)}
.esc{display:flex;font-size:8.5px;color:var(--txt);min-width:340px;margin-top:2px}
.esc span{flex:1;text-align:left}

/* Panel lateral */
#panel{position:fixed;top:0;right:0;width:min(430px,94vw);height:100vh;background:var(--w);
  box-shadow:-6px 0 26px rgba(43,11,107,.22);z-index:200;transform:translateX(102%);
  transition:transform .22s;display:flex;flex-direction:column}
#panel.abierto{transform:none}
.p-cab{background:linear-gradient(100deg,var(--azul),var(--azul2));color:#fff;padding:17px 20px}
.p-cab .x{float:right;background:none;border:none;color:#fff;font-size:21px;line-height:1;opacity:.75}
.p-cab .x:hover{opacity:1}
.p-cab h3{font-size:16px;margin-bottom:3px}
.p-cab p{font-size:11.5px;color:#C4B5FD}
.p-body{flex:1;overflow-y:auto;padding:15px 18px}
.p-ag{border:1px solid var(--ln);border-radius:10px;padding:11px 13px;margin-bottom:9px}
.p-ag b{display:block;font-size:12.5px;line-height:1.35}
.p-ag .m{font-size:10.5px;color:var(--txt);margin-top:3px}
.vacio{text-align:center;padding:40px 18px;color:var(--txt);font-size:13px}
#velo{position:fixed;inset:0;background:rgba(30,18,53,.42);z-index:190;display:none}
#velo.on{display:block}

@media print{nav,#panel,#velo,.dias{display:none}.sec{display:block!important}}
</style>
</head>
<body>

<nav>
  <div class="nlogo">🗓 <div>Malla de turnos<small id="n-sem">Semana 42</small></div></div>
  <div class="ntabs" id="tabs">
    <button class="ntab act" onclick="ir('mapa',this)">📊 Cobertura hora a hora</button>
    <button class="ntab" onclick="ir('lista',this)">👥 Agentes del día</button>
    <button class="ntab" onclick="ir('semana',this)">📅 Resumen de la semana</button>
  </div>
  <div class="nder">
    <select id="f-sk" onchange="pintar()"></select>
    <select id="f-sup" onchange="pintar()"></select>
    <input type="text" id="q" placeholder="Buscar agente o cédula..." oninput="pintar()">
  </div>
</nav>

<main>
  <div class="dias" id="dias"></div>
  <div class="sec act" id="s-mapa"></div>
  <div class="sec" id="s-lista"></div>
  <div class="sec" id="s-semana"></div>
</main>

<div id="velo" onclick="cerrarPanel()"></div>
<div id="panel">
  <div class="p-cab">
    <button class="x" onclick="cerrarPanel()">×</button>
    <h3 id="p-tit"></h3><p id="p-sub"></p>
  </div>
  <div class="p-body" id="p-body"></div>
</div>

p":"DOTOR SANTIAGO ALEX ALEJANDRO","sk":"MONITOREO TRANSACCIONAL","nov":"DES","hrs":0,"ini":0,"fin":0,"ps":[]},{"f":"2026-10-18","doc":"66765227","nom":"LUCIA VELASCO OLGA","sup":"SANCHEZ MOSQUERA NASLY GISSELLA","sk":"OUT","nov":"DES","hrs":0,"ini":0,"fin":0,"ps":[]},{"f":"2026-10-18","doc":"79712616","nom":"HERNANDO ANDRES SUAREZ CONTRERAS","sup":"SANCHEZ MOSQUERA NASLY GISSELLA","sk":"OUT","nov":"DES","hrs":0,"ini":0,"fin":0,"ps":[]},{"f":"2026-10-18","doc":"79793770","nom":"CARLOS ALBERTO LANCHEROS NOVOA","sup":"ORTIZ QUITIAN OLGA LUCIA","sk":"PQR","nov":"DES","hrs":0,"ini":0,"fin":0,"ps":[]},{"f":"2026-10-18","doc":"80068136","nom":"WILSON JAVIER QUINTERO MONTAÑA","sup":"ORTIZ QUITIAN OLGA LUCIA","sk":"PQR","nov":"DES","hrs":0,"ini":0,"fin":0,"ps":[]},{"f":"2026-10-18","doc":"80085104","nom":"JHON JAIRO CORTES AMAYA","sup":"NARIÑO BERNAL OSCAR DENIEL","sk":"CHAT","nov":"TUR","hrs":7,"ini":600,"fin":1020,"ps":[[720,735,"Descanso 1"],[900,915,"Descanso 2"]]},{"f":"2026-10-18","doc":"80149599","nom":"FRANCK ALAPE PULIDO","sup":"VALENZUELA AREVALO JUAN SEBASTIAN","sk":"INB","nov":"DES","hrs":0,"ini":0,"fin":0,"ps":[]},{"f":"2026-10-18","doc":"80919034","nom":"PEDRO ANTONIO LARGO CAMACHO","sup":"SANCHEZ MOSQUERA NASLY GISSELLA","sk":"INB","nov":"DES","hrs":0,"ini":0,"fin":0,"ps":[]}]</script>
<script>
/* ══ DATOS Y DICCIONARIOS ══════════════════════════════════════════ */
var FILAS = JSON.parse(document.getElementById('datos').textContent);

/* Nombres completos de lo que en la malla viene abreviado */
var SKILL = { 'INB':'Inbound', 'OUT':'Outbound', 'CHAT':'Chat', 'RRSS':'RRSS',
  'EMAIL':'Email', 'PQR':'PQR', 'BACKOFFICE':'Backoffice',
  'MONITOREO TRANSACCIONAL':'Monitoreo Transaccional' };
var COLOR = { 'INB':'#4A1D96', 'OUT':'#0891B2', 'CHAT':'#7C3AED', 'RRSS':'#DB2777',
  'EMAIL':'#D97706', 'PQR':'#059669', 'BACKOFFICE':'#64748B',
  'MONITOREO TRANSACCIONAL':'#2563EB' };
/* Novedad: TUR es el único que significa que el agente viene a trabajar */
var NOVEDAD = { 'TUR':['En turno','ok'], 'DES':['Descanso','txt'], 'VAC':['Vacaciones','wn'],
  'LMA':['Licencia','wn'], 'ICCP':['Incapacidad','bad'], 'SUS':['Suspensión','bad'] };
var DIAS_SEM = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

var FECHAS = [...new Set(FILAS.map(function(f){ return f.f; }))].sort();
var DIA = FECHAS[0];
var VISTA = 'mapa';
var MODO = 'turno';          // 'turno' = en malla · 'conectado' = descontando pausas

var esc = function(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
var hhmm = function(m){ m=((m%1440)+1440)%1440;
  return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
var norm = function(s){ return String(s||'').toUpperCase()
  .normalize('NFD').replace(/[̀-ͯ]/g,''); };
function fechaLarga(f){
  var d=new Date(f+'T00:00:00');
  return DIAS_SEM[d.getDay()]+' '+d.getDate()+' de '
    +['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre',
      'octubre','noviembre','diciembre'][d.getMonth()];
}

/* ══ FILTROS ═══════════════════════════════════════════════════════ */
function filtros(){
  return { sk:document.getElementById('f-sk').value,
           sup:document.getElementById('f-sup').value,
           q:norm(document.getElementById('q').value.trim()) };
}
function pasa(f, ft){
  if(ft.sk && f.sk!==ft.sk) return false;
  if(ft.sup && f.sup!==ft.sup) return false;
  if(ft.q && norm(f.nom).indexOf(ft.q)===-1 && f.doc.indexOf(ft.q)===-1) return false;
  return true;
}

/* ══ COBERTURA ═════════════════════════════════════════════════════
   Un turno de 22:00 a 05:00 ocupa dos días: las horas antes de medianoche
   cuentan en su fecha y las de madrugada en la del día siguiente. Por eso
   la cobertura de un día se arma mirando también la víspera.          */
function turnosQueTocan(fecha, ft){
  var ayer = new Date(new Date(fecha+'T00:00:00').getTime()-86400000)
               .toISOString().slice(0,10);
  var out=[];
  FILAS.forEach(function(f){
    if(f.nov!=='TUR' || f.fin===f.ini) return;
    if(!pasa(f, ft)) return;
    var cruza = f.fin <= f.ini;
    if(f.f===fecha)        out.push({f:f, ini:f.ini, fin:cruza? f.fin+1440 : f.fin});
    else if(f.f===ayer && cruza) out.push({f:f, ini:f.ini-1440, fin:f.fin});  // cola de madrugada
  });
  return out;
}
/* ¿El agente está disponible en ese minuto? En modo conectado se
   descuentan descansos, almuerzo y capacitación. */
function dentro(t, a, b){
  if(!(Math.max(t.ini,a) < Math.min(t.fin,b))) return false;
  if(MODO==='turno') return true;
  var libre = Math.min(t.fin,b)-Math.max(t.ini,a);
  (t.f.ps||[]).forEach(function(p){
    var pi=p[0], pf=p[1];
    if(t.ini<0){ pi-=1440; pf-=1440; }           // la cola de madrugada corre un día
    libre -= Math.max(0, Math.min(pf,b)-Math.max(pi,a));
  });
  return libre > 0;
}
function cobertura(fecha, ft){
  var ts=turnosQueTocan(fecha, ft);
  var skills=[...new Set(ts.map(function(t){ return t.f.sk; }))]
    .sort(function(a,b){ return (SKILL[a]||a).localeCompare(SKILL[b]||b); });
  var grid={}, total=[];
  skills.forEach(function(s){ grid[s]=[]; });
  for(var h=0; h<24; h++){
    var a=h*60, b=a+60, tot=0;
    skills.forEach(function(s){
      var n=ts.filter(function(t){ return t.f.sk===s && dentro(t,a,b); }).length;
      grid[s].push(n); tot+=n;
    });
    total.push(tot);
  }
  return { skills:skills, grid:grid, total:total, ts:ts };
}
function agentesEn(fecha, sk, h, ft){
  var a=h*60, b=a+60;
  return turnosQueTocan(fecha, ft)
    .filter(function(t){ return (!sk||t.f.sk===sk) && dentro(t,a,b); })
    .map(function(t){ return t.f; })
    .sort(function(x,y){ return x.nom.localeCompare(y.nom); });
}

/* ══ PINTADO ═══════════════════════════════════════════════════════ */
function pintarDias(){
  document.getElementById('dias').innerHTML = FECHAS.map(function(f){
    var n = FILAS.filter(function(x){ return x.f===f && x.nov==='TUR'; }).length;
    var d = new Date(f+'T00:00:00');
    return '<button class="dia'+(f===DIA?' act':'')+'" onclick="verDia(\''+f+'\')">'
      +'<b>'+DIAS_SEM[d.getDay()]+'</b><span>'+d.getDate()+' oct</span>'
      +'<i>'+n+' en turno</i></button>';
  }).join('');
}
function verDia(f){ DIA=f; pintarDias(); pintar(); }

function pintarFiltros(){
  var sks=[...new Set(FILAS.map(function(f){ return f.sk; }))].sort();
  var sups=[...new Set(FILAS.map(function(f){ return f.sup; }))].filter(Boolean).sort();
  var s1=document.getElementById('f-sk'), s2=document.getElementById('f-sup');
  if(!s1.options.length)
    s1.innerHTML='<option value="">Todos los skills</option>'
      +sks.map(function(s){ return '<option value="'+esc(s)+'">'+esc(SKILL[s]||s)+'</option>'; }).join('');
  if(!s2.options.length)
    s2.innerHTML='<option value="">Todos los supervisores</option>'
      +sups.map(function(s){ return '<option value="'+esc(s)+'">'+esc(s)+'</option>'; }).join('');
}

function tono(n, max){
  if(!n) return 'background:#FBFAFE;color:#D5CFE8';
  var p=max? n/max : 0;
  var l=93-p*44;                       // claro a oscuro según cuántos haya
  return 'background:hsl(262,62%,'+l+'%);color:'+(p>0.45?'#fff':'var(--azul2)');
}

function pintarMapa(){
  var ft=filtros(), c=cobertura(DIA, ft);
  var cont=document.getElementById('s-mapa');
  if(!c.skills.length){
    cont.innerHTML='<div class="card"><div class="vacio">Ningún agente en turno con estos filtros.</div></div>';
    return;
  }
  var max=Math.max.apply(null, c.skills.map(function(s){
    return Math.max.apply(null, c.grid[s]); }));
  var pico=Math.max.apply(null, c.total), hPico=c.total.indexOf(pico);
  var diaF=FILAS.filter(function(f){ return f.f===DIA; });
  var enTurno=diaF.filter(function(f){ return f.nov==='TUR' && pasa(f,ft); }).length;
  var noVienen={};
  diaF.forEach(function(f){ if(f.nov!=='TUR' && pasa(f,ft)) noVienen[f.nov]=(noVienen[f.nov]||0)+1; });
  var horas=diaF.filter(function(f){ return f.nov==='TUR' && pasa(f,ft); })
                .reduce(function(a,f){ return a+(+f.hrs||0); }, 0);

  var h='<div class="kpis">'
   +'<div class="kpi ok"><div class="n">Agentes en turno</div><div class="v">'+enTurno+'</div>'
     +'<div class="d">'+fechaLarga(DIA)+'</div></div>'
   +'<div class="kpi"><div class="n">Horas programadas</div><div class="v">'
     +horas.toLocaleString('es-CO')+'</div><div class="d">Suma de la malla</div></div>'
   +'<div class="kpi"><div class="n">Pico de cobertura</div><div class="v">'+pico+'</div>'
     +'<div class="d">A las '+String(hPico).padStart(2,'0')+':00</div></div>'
   +'<div class="kpi"><div class="n">Skills activos</div><div class="v">'+c.skills.length+'</div>'
     +'<div class="d">Con gente en malla</div></div>';
  Object.keys(noVienen).sort().forEach(function(k){
    var nv=NOVEDAD[k]||[k,'txt'];
    h+='<div class="kpi '+(nv[1]==='txt'?'':nv[1])+'"><div class="n">'+nv[0]+'</div>'
      +'<div class="v">'+noVienen[k]+'</div><div class="d">No vienen</div></div>';
  });
  h+='</div>';

  h+='<div class="card"><div class="ch">COBERTURA HORA A HORA'
    +'<small>'+fechaLarga(DIA)+'</small>'
    +'<span class="der">'
      +'<button class="sw'+(MODO==='turno'?' act':'')+'" onclick="setModo(\'turno\')">En turno</button>'
      +'<button class="sw'+(MODO==='conectado'?' act':'')+'" onclick="setModo(\'conectado\')">Descontando pausas</button>'
    +'</span></div><div class="cbody"><table class="mapa"><thead><tr><th class="sk">Skill</th>';
  for(var i=0;i<24;i++) h+='<th>'+String(i).padStart(2,'0')+'</th>';
  h+='</tr></thead><tbody>';
  c.skills.forEach(function(s){
    h+='<tr><td class="sk"><span class="sk-tag" style="background:'+(COLOR[s]||'#4A1D96')+'">'
      +esc(SKILL[s]||s)+'</span></td>';
    for(var i=0;i<24;i++){
      var n=c.grid[s][i];
      h+='<td class="c" style="'+tono(n,max)+'" onclick="verCelda(\''+esc(s)+'\','+i+')" '
        +'title="'+esc(SKILL[s]||s)+' · '+String(i).padStart(2,'0')+':00 · '+n+' agente(s)">'
        +(n||'')+'</td>';
    }
    h+='</tr>';
  });
  h+='<tr class="tot"><td class="sk">TOTAL</td>';
  for(var i=0;i<24;i++)
    h+='<td class="c" onclick="verCelda(\'\','+i+')">'+(c.total[i]||'')+'</td>';
  h+='</tr></tbody></table></div>'
    +'<div class="lg"><b>Toca una casilla para ver quiénes son.</b>'
    +'<i style="'+tono(1,max)+'"></i> pocos <i style="'+tono(max,max)+'"></i> muchos'
    +(MODO==='conectado'
      ? '<span style="color:var(--wn);font-weight:700">Se descuentan descansos, almuerzo y capacitación.</span>'
      : '<span>Cuenta a todos los que están en malla, estén o no en pausa.</span>')
    +'</div></div>';
  cont.innerHTML=h;
}

function setModo(m){ MODO=m; pintar(); }

function barra(f){
  var ini=f.ini, fin=f.fin<=f.ini? f.fin+1440 : f.fin;
  var p=function(m){ return (m/1440*100); };
  var h='<div class="barra">';
  for(var k=3;k<24;k+=3) h+='<div class="hr" style="left:'+p(k*60)+'%"></div>';
  h+='<div class="t" style="left:'+p(ini)+'%;width:'+p(fin-ini)+'%"></div>';
  (f.ps||[]).forEach(function(x){
    h+='<div class="p" style="left:'+p(x[0])+'%;width:'+p(x[1]-x[0])+'%" title="'
      +esc(x[2])+' '+hhmm(x[0])+'-'+hhmm(x[1])+'"></div>';
  });
  h+='<b style="left:'+(p(ini)+0.6)+'%">'+hhmm(f.ini)+'–'+hhmm(f.fin)+'</b></div>';
  return h;
}

function pintarLista(){
  var ft=filtros();
  var fs=FILAS.filter(function(f){ return f.f===DIA && pasa(f,ft); })
    .sort(function(a,b){
      if((a.nov==='TUR')!==(b.nov==='TUR')) return a.nov==='TUR'?-1:1;
      if(a.nov==='TUR' && a.ini!==b.ini) return a.ini-b.ini;
      return a.nom.localeCompare(b.nom); });
  var cont=document.getElementById('s-lista');
  if(!fs.length){ cont.innerHTML='<div class="card"><div class="vacio">Sin agentes con estos filtros.</div></div>'; return; }
  var vienen=fs.filter(function(f){ return f.nov==='TUR'; }).length;
  var h='<div class="card"><div class="ch">AGENTES DEL DÍA<small>'+fechaLarga(DIA)
    +' · '+vienen+' en turno de '+fs.length+' en la malla</small></div>'
    +'<div class="cbody"><table class="ag"><thead><tr>'
    +'<th>Agente</th><th>Cédula</th><th>Skill</th><th>Supervisor</th><th>Estado</th>'
    +'<th>Horario</th><th style="min-width:350px">Jornada <span style="font-weight:600;'
    +'text-transform:none;opacity:.75">(00:00 a 24:00)</span></th></tr></thead><tbody>';
  fs.forEach(function(f){
    var nv=NOVEDAD[f.nov]||[f.nov,'txt'];
    var colores={ok:'var(--ok-bg);color:var(--ok)', wn:'var(--wn-bg);color:var(--wn)',
                  bad:'var(--bad-bg);color:var(--bad)', txt:'#F1F5F9;color:var(--txt)'};
    h+='<tr><td style="font-weight:700">'+esc(f.nom)+'</td>'
      +'<td style="font-family:monospace;font-size:11px;color:var(--txt)">'+esc(f.doc)+'</td>'
      +'<td><span class="sk-tag" style="background:'+(COLOR[f.sk]||'#4A1D96')+'">'
        +esc(SKILL[f.sk]||f.sk)+'</span></td>'
      +'<td style="font-size:11px;color:var(--txt)">'+esc(f.sup)+'</td>'
      +'<td><span class="pill" style="background:'+colores[nv[1]]+'">'+nv[0]+'</span></td>'
      +'<td style="font-weight:700;white-space:nowrap">'
        +(f.nov==='TUR'? hhmm(f.ini)+' – '+hhmm(f.fin)+'<div style="font-size:10px;color:var(--txt);'
          +'font-weight:600">'+f.hrs+' h</div>' : '—')+'</td>'
      +'<td>'+(f.nov==='TUR'? barra(f)
        +'<div class="esc"><span>00</span><span>06</span><span>12</span><span>18</span>'
        +'<span style="flex:0">24</span></div>' : '')+'</td></tr>';
  });
  cont.innerHTML=h+'</tbody></table></div></div>';
}

function pintarSemana(){
  var ft=filtros();
  var sks=[...new Set(FILAS.filter(function(f){ return f.nov==='TUR' && pasa(f,ft); })
    .map(function(f){ return f.sk; }))].sort(function(a,b){
      return (SKILL[a]||a).localeCompare(SKILL[b]||b); });
  var h='<div class="card"><div class="ch">AGENTES EN TURNO POR DÍA'
    +'<small>Semana del 12 al 18 de octubre</small></div><div class="cbody">'
    +'<table class="mapa"><thead><tr><th class="sk">Skill</th>';
  FECHAS.forEach(function(f){
    var d=new Date(f+'T00:00:00');
    h+='<th style="min-width:86px">'+DIAS_SEM[d.getDay()].slice(0,3)+' '+d.getDate()+'</th>';
  });
  h+='<th style="min-width:72px">Total</th></tr></thead><tbody>';
  var max=0, celdas={};
  sks.forEach(function(s){
    celdas[s]=FECHAS.map(function(f){
      var n=FILAS.filter(function(x){ return x.f===f && x.sk===s && x.nov==='TUR' && pasa(x,ft); }).length;
      if(n>max) max=n; return n; });
  });
  sks.forEach(function(s){
    h+='<tr><td class="sk"><span class="sk-tag" style="background:'+(COLOR[s]||'#4A1D96')+'">'
      +esc(SKILL[s]||s)+'</span></td>';
    celdas[s].forEach(function(n,i){
      h+='<td class="c" style="'+tono(n,max)+'" onclick="verDiaSkill(\''+FECHAS[i]+'\',\''+esc(s)+'\')">'
        +(n||'')+'</td>';
    });
    h+='<td style="font-weight:800;color:var(--azul2);background:#FAF8FF">'
      +celdas[s].reduce(function(a,b){return a+b;},0)+'</td></tr>';
  });
  h+='<tr class="tot"><td class="sk">TOTAL</td>';
  var gran=0;
  FECHAS.forEach(function(f,i){
    var t=sks.reduce(function(a,s){ return a+celdas[s][i]; },0); gran+=t;
    h+='<td>'+t+'</td>';
  });
  h+='<td>'+gran+'</td></tr></tbody></table></div>'
    +'<div class="lg">Cada casilla cuenta agentes con novedad <b>TUR</b>. '
    +'Toca una para ver el detalle de ese día.</div></div>';
  document.getElementById('s-semana').innerHTML=h;
}

/* ══ PANEL ═════════════════════════════════════════════════════════ */
function verCelda(sk, h){
  var ags=agentesEn(DIA, sk, h, filtros());
  abrirPanel(
    (sk? (SKILL[sk]||sk) : 'Todos los skills')+' · '+String(h).padStart(2,'0')+':00',
    fechaLarga(DIA)+' · '+ags.length+' agente(s)'
      +(MODO==='conectado'? ' disponibles (sin pausa)' : ' en turno'),
    ags);
}
function verDiaSkill(f, sk){
  DIA=f; pintarDias();
  var ags=FILAS.filter(function(x){ return x.f===f && x.sk===sk && x.nov==='TUR' && pasa(x,filtros()); })
    .sort(function(a,b){ return a.ini-b.ini; });
  abrirPanel((SKILL[sk]||sk), fechaLarga(f)+' · '+ags.length+' en turno', ags);
}
function abrirPanel(tit, sub, ags){
  document.getElementById('p-tit').textContent=tit;
  document.getElementById('p-sub').textContent=sub;
  document.getElementById('p-body').innerHTML = ags.length
    ? ags.map(function(f){
        return '<div class="p-ag"><b>'+esc(f.nom)+'</b>'
          +'<div class="m"><span class="sk-tag" style="background:'+(COLOR[f.sk]||'#4A1D96')
            +'">'+esc(SKILL[f.sk]||f.sk)+'</span> &nbsp;'
          +'<b style="color:var(--azul2)">'+hhmm(f.ini)+' – '+hhmm(f.fin)+'</b> · '+f.hrs+' h</div>'
          +'<div class="m">C.C. '+esc(f.doc)+'</div>'
          +'<div class="m">Supervisor: '+esc(f.sup)+'</div>'
          +((f.ps||[]).length? '<div class="m" style="margin-top:5px">Pausas: '
              +f.ps.map(function(p){ return esc(p[2])+' '+hhmm(p[0])+'-'+hhmm(p[1]); }).join(' · ')
              +'</div>' : '')
          +'</div>';
      }).join('')
    : '<div class="vacio">Nadie en esta franja.</div>';
  document.getElementById('panel').classList.add('abierto');
  document.getElementById('velo').classList.add('on');
}
function cerrarPanel(){
  document.getElementById('panel').classList.remove('abierto');
  document.getElementById('velo').classList.remove('on');
}
document.addEventListener('keydown', function(e){ if(e.key==='Escape') cerrarPanel(); });

function ir(v, btn){
  VISTA=v;
  document.querySelectorAll('.sec').forEach(function(s){ s.classList.remove('act'); });
  document.getElementById('s-'+v).classList.add('act');
  document.querySelectorAll('.ntab').forEach(function(t){ t.classList.remove('act'); });
  btn.classList.add('act');
  document.getElementById('dias').style.display = (v==='semana')? 'none' : 'flex';
  pintar();
}
function pintar(){
  if(VISTA==='mapa')        pintarMapa();
  else if(VISTA==='lista')  pintarLista();
  else                      pintarSemana();
}

document.getElementById('n-sem').textContent =
  'Semana 42 · '+FECHAS[0].split('-').reverse().slice(0,2).join('/')+' al '
  +FECHAS[FECHAS.length-1].split('-').reverse().slice(0,2).join('/')+' · '
  +[...new Set(FILAS.map(function(f){return f.doc;}))].length+' agentes';
pintarFiltros(); pintarDias(); pintar();
</script>
</body>
</html>
